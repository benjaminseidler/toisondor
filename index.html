<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6B6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rallye 🏕️">
  <title>Camping Rallye 🏕️</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">

  <!-- Leaflet CSS (local) -->
  <link rel="stylesheet" href="css/leaflet.css">
  <!-- App styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── START SCREEN ─────────────────────────── -->
<div id="screen-start" class="screen active">
  <div id="start-logo" class="start-logo">🏕️</div>
  <h1 class="start-title">Camping<br>Rallye!</h1>
  <p class="start-subtitle">Toison d'Or · Ramatuelle</p>
  <button id="btn-start" class="btn-start">Los geht's! 🚀</button>
  <p style="color:rgba(255,255,255,0.7); font-size:0.8rem; margin-top:8px;">
    20 Stationen warten auf euch 🌟
  </p>
</div>

<!-- ── MAP SCREEN ───────────────────────────── -->
<div id="screen-map" class="screen">
  <div class="map-header">
    <h1>🏕️ Camping Rallye</h1>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-label">
      <span id="progress-text">⭐ 0 von 10 Aufgaben</span>
    </div>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div id="map"></div>
  <button id="btn-gps" class="btn-gps" title="Mein Standort">📍</button>
</div>

<input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none">

<!-- ── STATION BOTTOM SHEET ─────────────────── -->
<div id="station-sheet">
  <button id="btn-close-sheet" class="btn-close-sheet">✕</button>
  <div class="sheet-handle"></div>
  <span class="station-number-badge" id="sheet-number">Station 1 von 10</span>
  <span class="station-emoji" id="sheet-emoji">🏕️</span>
  <h2 class="station-name" id="sheet-name">Station</h2>
  <div class="task-text" id="sheet-task">Aufgabe...</div>
  <button id="btn-photo" class="btn-photo">📷 Foto machen</button>
  <button id="btn-done" class="btn-done">✅ Aufgabe erledigt!</button>
</div>

<!-- ── FINISH SCREEN ─────────────────────────── -->
<div id="screen-finish" class="screen">
  <canvas id="confetti-canvas"></canvas>
  <div class="finish-emoji">🏆</div>
  <h1 class="finish-title">Geschafft!</h1>
  <div class="finish-stars">⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐</div>
  <p class="finish-text">
    Ihr seid echte<br>Camping-Champions! 🎉<br><br>
    Alle 20 Stationen gefunden –<br>Bravo! 👏
  </p>
  <button id="btn-restart" class="btn-restart">🔄 Neue Rallye</button>
</div>

<!-- ── TOAST ──────────────────────────────────── -->
<div id="toast" class="toast"></div>

<!-- Leaflet JS (local) -->
<script src="js/leaflet.js"></script>
<!-- Leaflet rotate plugin (local) -->
<script src="js/leaflet-rotate.js"></script>
<!-- App scripts -->
<script src="js/config.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>

<!-- Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
